<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Browser Title -->
    <title>Mukti & Mihir Wedding Invitation</title>

    <!-- SEO -->
    <meta
      name="description"
      content="A cinematic interactive wedding invitation and love story website for Mukti and Mihir."
    />

    <!-- Open Graph / WhatsApp / Facebook -->
    <meta
      property="og:title"
      content="Mukti & Mihir Wedding Invitation"
    />

    <meta
      property="og:description"
      content="A cinematic interactive wedding invitation and love story website for Mukti and Mihir."
    />

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:url"
      content="https://mm-wedding-invitation-blue.vercel.app/"
    />

    <!-- High-Resolution Wedding Preview Image -->
    <meta
      property="og:image"
      content="https://mm-wedding-invitation-blue.vercel.app/wedding-preview.jpg"
    />

    <meta
      property="og:image:secure_url"
      content="https://mm-wedding-invitation-blue.vercel.app/wedding-preview.jpg"
    />

    <meta
      property="og:image:type"
      content="image/jpeg"
    />

    <!-- Actual Image Dimensions -->
    <meta
      property="og:image:width"
      content="2048"
    />

    <meta
      property="og:image:height"
      content="1365"
    />

    <meta
      property="og:site_name"
      content="Mihir & Mukti Wedding"
    />

    <!-- Twitter / Social Media -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Mukti & Mihir Wedding Invitation"
    />

    <meta
      name="twitter:description"
      content="A cinematic interactive wedding invitation and love story website for Mukti and Mihir."
    />

    <meta
      name="twitter:image"
      content="https://mm-wedding-invitation-blue.vercel.app/wedding-preview.jpg"
    />

    <!-- Favicon -->
    <link
      rel="icon"
      href="/favicon.ico"
    />
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
